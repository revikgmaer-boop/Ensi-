<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<title>ENSĪ CONNECT</title>
<style>
:root{--bg:#000;--fg:#f2f2f2;--mut:#8a8a8a;--mut2:#5a5a5a;--line:#1f1f1f;--line2:#2e2e2e;--ok:#e9e9e9}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.c{width:100%;max-width:420px;padding:32px 16px}
.b{font-weight:700;letter-spacing:.3em;font-size:13px;color:var(--mut);margin:0 0 44px}
h1{font-size:30px;line-height:1.1;letter-spacing:-.02em;font-weight:600;margin:0 0 10px}
p{color:var(--mut);margin:0 0 24px}
.code{font:500 13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--fg);background:#0e0e0e;border:1px solid var(--line2);border-radius:12px;padding:12px 14px;word-break:break-all;margin:0 0 18px;max-height:120px;overflow:auto}
a,button{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;margin:0 0 10px;border-radius:14px;border:1px solid var(--line2);background:none;color:var(--fg);font-family:inherit;font-size:16px;font-weight:600;line-height:1;text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.p{background:var(--fg);color:#000;border-color:var(--fg)}
a:active,button:active{transform:scale(.98)}
ol{color:var(--mut);padding-left:20px;margin:0 0 24px}ol li{margin:0 0 6px}ol b{color:var(--fg);font-weight:600}
.n{font-size:13px;color:var(--mut2);margin-top:16px}
</style>
</head>
<body>
<main class="c" id="app"></main>
<script>
(function(){
  var BOT='Ensiinternetbot', q=new URLSearchParams(location.search), code=q.get('code'), err=q.get('error'), app=document.getElementById('app');
  var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
  var head='<div class="b">ENSĪ</div>';
  if(code){
    var full=location.href;
    app.innerHTML=head+'<h1>Кошелёк ЮMoney разрешён</h1><p>Осталось передать код боту — он живёт около минуты.</p>'+
      '<ol><li>Нажмите <b>«Скопировать и открыть бота»</b></li><li>В чате с ботом вставьте и отправьте</li><li>Бот ответит «Кошелёк подключён»</li></ol>'+
      '<div class="code">'+esc(code)+'</div>'+
      '<button class="p" id="go">Скопировать и открыть бота</button><button id="cp">Только скопировать</button>'+
      '<p class="n">Код одноразовый и подходит только вашему боту. Если бот ответит, что код устарел, — подключите кошелёк заново.</p>';
    var copy=function(){return navigator.clipboard?navigator.clipboard.writeText(full):Promise.reject()};
    document.getElementById('cp').onclick=function(){var b=this;copy().then(function(){b.textContent='Скопировано'},function(){prompt('Скопируйте адрес',full)})};
    document.getElementById('go').onclick=function(){copy().catch(function(){prompt('Скопируйте адрес',full)}).then(function(){location.href='https://t.me/'+BOT})};
  }else if(err){
    app.innerHTML=head+'<h1>ЮMoney не дал доступ</h1><p>'+esc(q.get('error_description')||err)+'. Вернитесь в бота: Админка → «💳 ЮMoney» → «Подключить кошелёк».</p><a class="p" href="https://t.me/'+BOT+'">Открыть бота</a>';
  }else{
    app.innerHTML=head+'<h1>ENSĪ CONNECT</h1><p>Всё — подписка, оплата, подключение и поддержка — внутри Telegram.</p><a class="p" href="https://t.me/'+BOT+'">Открыть ENSĪ в Telegram</a>';
  }
})();
</script>
</body>
</html>
